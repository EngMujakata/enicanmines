// ==================== SMALL UTILITIES ====================
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function cssEscape(s) {
  return String(s == null ? '' : s).replace(/(["\\])/g, '\\$1');
}

function formatAssignmentDate(v){
  if(!v) return 'No due date';
  const d = new Date(String(v).length <= 10 ? v + 'T00:00:00' : v);
  return Number.isFinite(d.getTime()) ? d.toLocaleDateString() : String(v);
}
function assignmentDueLabel(v){
  const due = new Date(String(v).length <= 10 ? v + 'T23:59:59.999' : v).getTime();
  const now = Date.now();
  if (!Number.isFinite(due)) return '';
  if (now > due) {
    const days = Math.floor((now - due) / 86400000);
    if (days > 0) return days + ' day' + (days === 1 ? '' : 's') + ' overdue';
    const hours = Math.floor((now - due) / 3600000);
    if (hours > 0) return hours + ' hour' + (hours === 1 ? '' : 's') + ' overdue';
    const mins = Math.floor((now - due) / 60000);
    return (mins <= 1 ? 'Overdue' : mins + ' min overdue');
  }
  const diff = due - now;
  const days = Math.ceil(diff / 86400000);
  if (days <= 1) {
    const hours = Math.ceil(diff / 3600000);
    if (hours <= 1) return 'Due soon';
    return 'Due in ' + hours + ' hour' + (hours === 1 ? '' : 's');
  }
  return 'Due ' + formatAssignmentDate(v);
}
function assignmentDueClass(v){
  const due = new Date(String(v).length <= 10 ? v + 'T23:59:59.999' : v).getTime();
  return Number.isFinite(due) && Date.now() > due ? 'red' : 'blue';
}

          <div class="desc-body">${escapeHtml(a.description || 'No further description provided.')}</div>
        </div>
        <button class="btn btn-success" onclick="completeFromPopup('${escapeHtml(a.id)}', this)">Completed</button>
      </div>
    </div>
  `;
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) closeAssignmentPopup();
  });
  document.body.appendChild(overlay);
}

function closeAssignmentPopup() {
  document.querySelectorAll('.assignment-popup-overlay').forEach(el => el.remove());
}

async function completeFromPopup(id, btn) {
  setBtnLoading(btn, true);
  await withLoader('Completing assignment…', async () => {
    const res = await apiPost({
      action: 'completeAssignment',
      assignmentId: id,
      idempotencyKey: uid('TASKDONE', id),
      user: state.user.username
    });
    if (!res.success) { toast(res.error || 'Could not complete assignment', 'error'); return; }
    toast(res.timingText || 'Assignment completed', 'success');
    closeAssignmentPopup();
    state.myAssignments = (state.myAssignments || []).filter(x => String(x.id) !== String(id));
    updateFloatingBadge(state.myAssignments.length);
    refreshMyAssignmentsBadge();
    if (state.page === 'dashboard' || state.page === 'profile' || state.page === 'reports' || state.page === 'driver') {
      loadPage(true);
    }
  });
  setBtnLoading(btn, false);
}

async function checkSuperAdminCompletionPopup() {
  if (!state.user) return;
  if (String(state.user.role).toLowerCase() !== 'super admin') return;
  let res;
  try { res = await apiGet({ action: 'assignmentCompletions' }, { silent: true }); } catch (e) { return; }
  if (!res || !res.success) return;
  const list = res.assignments || [];
  state.superAdminCompletions = list;
  if (list.length === 0) return;
  const latest = list[0];
  const signature = String(latest.id) + '|' + String(latest.completedAt);
  let seen = '';
  try { seen = sessionStorage.getItem(SUPER_COMPLETION_SEEN_KEY) || ''; } catch (e) {}
  if (seen === signature) return;
  try { sessionStorage.setItem(SUPER_COMPLETION_SEEN_KEY, signature); } catch (e) {}
  showSuperCompletionModal(latest);
}

function showSuperCompletionModal(a) {
  document.querySelectorAll('.assignment-popup-overlay').forEach(el => el.remove());
  const late = String(a.completionStatus).toLowerCase() === 'late';
  const timingClass = late ? 'timing-late' : 'timing-on-time';
  const overlay = document.createElement('div');
  overlay.className = 'assignment-popup-overlay';
  overlay.innerHTML = `
    <div class="assignment-popup" role="dialog" aria-modal="true">
      <div class="assignment-popup-header" style="background:linear-gradient(135deg,#16a34a,#15803d)">
        <div class="popup-title">Assignment Completed</div>
        <h2>${escapeHtml(a.title)}</h2>
        <button class="assignment-popup-close" onclick="closeAssignmentPopup()" aria-label="Close">×</button>
      </div>
      <div class="assignment-popup-body">
        <div class="info-block">
          <div class="lbl">Completed by</div>
          <div class="val">${escapeHtml(a.assignedToName || a.completedBy || a.assignedTo || '—')}</div>
        </div>
        <div class="info-block">
          <div class="lbl">Due date</div>
          <div class="val">${formatAssignmentDate(a.dueDate)}</div>
        </div>
        <div class="info-block">
          <div class="lbl">Completed at</div>
          <div class="val">${a.completedAt ? new Date(a.completedAt).toLocaleString() : '—'}</div>
        </div>
        <div class="assignment-completed-box">
          <div class="assignment-timing-badge ${timingClass}" style="font-size:13px;padding:8px 16px">${escapeHtml(a.timingText || (late ? 'Late' : 'On time'))}</div>
        </div>
        <button class="btn" style="margin-top:16px" onclick="closeAssignmentPopup()">Close</button>
      </div>
    </div>
  `;
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) closeAssignmentPopup();
  });
  document.body.appendChild(overlay);
}

// ==================== SUPER ADMIN: ASSIGNMENTS PAGE ====================

async function renderAssignments(el) {
  const tk = loadToken();
  if (!state.user || String(state.user.role).toLowerCase() !== 'super admin') {
    el.innerHTML = '<div class="card"><p style="color:#dc2626">Access denied. Super Admin only.</p></div>';
    return;
  }
  document.getElementById('headerSub').textContent = 'Assign and monitor tasks';
  const [usersRes, assignmentsRes] = await Promise.all([
    apiGet({ action: 'listUsers' }, { silent: true }),
    apiGet({ action: 'assignments' }, { silent: true })
  ]);
  if (isStale(tk)) return;
  if (!usersRes.success) throw new Error(usersRes.error || 'Could not load users');
  if (!assignmentsRes.success) throw new Error(assignmentsRes.error || 'Could not load assignments');
  const users = (usersRes.users || []).filter(u =>
    (String(u.active).toUpperCase() === 'TRUE' || u.active === true) &&
    String(u.username).toLowerCase() !== String(state.user.username).toLowerCase()
  );
  const all = assignmentsRes.assignments || [];
  const open = all.filter(a => String(a.status).toLowerCase() !== 'completed');
  const completed = all.filter(a => String(a.status).toLowerCase() === 'completed');
  const completedShown = completed.slice(0, 20);

  el.innerHTML = `
    <div class="section-title">New Assignment</div>
    <div class="card">
      <div class="field"><label>Task title</label><input id="taskTitle" type="text" placeholder="e.g. Inspect Tank Area"></div>
      <div class="field"><label>Task description / instructions</label><textarea id="taskDescription" rows="5" placeholder="Describe everything the user must do..."></textarea></div>
      <div class="field"><label>Assign user</label><select id="taskAssignee"><option value="">Select user account</option>${users.map(u=>`<option value="${escapeHtml(u.username)}">${escapeHtml(u.fullName||u.username)} (@${escapeHtml(u.username)})</option>`).join('')}</select></div>
      <div class="field"><label>Due date</label><input id="taskDueDate" type="date"></div>
      <button class="btn" onclick="createAssignmentFromUI(this)">Assign Task</button>
    </div>
    <div class="section-title">Open Assignments (${open.length})</div>
    ${open.length ? open.map(a => `
      <div class="assignment-card ${assignmentDueClass(a.dueDate) === 'red' ? 'overdue' : ''}">
        <div class="assignment-title">${escapeHtml(a.title)}</div>
        <div class="assignment-meta">
          <span>👤 ${escapeHtml(a.assignedToName || a.assignedTo)}</span>
          <span>📅 Due ${formatAssignmentDate(a.dueDate)}</span>
        </div>
        <div class="assignment-meta" style="margin-top:6px">
          <span class="assignment-timing-badge ${assignmentDueClass(a.dueDate) === 'red' ? 'timing-overdue' : 'timing-open'}">${assignmentDueLabel(a.dueDate)}</span>
        </div>
        <div class="assignment-desc">${escapeHtml(a.description || '')}</div>
      </div>
    `).join('') : '<div class="empty">No open assignments.</div>'}
    <div class="section-title">Completed Assignments (${completed.length}${completed.length > completedShown.length ? ', latest 20 shown' : ''})</div>
    ${completedShown.length ? completedShown.map(a => {
      const late = String(a.completionStatus).toLowerCase() === 'late';
      return `
        <div class="assignment-card ${late ? 'late-done' : 'on-time-done'}">
          <div class="assignment-title">${escapeHtml(a.title)}</div>
          <div class="assignment-meta">
            <span>👤 ${escapeHtml(a.assignedToName || a.completedBy || a.assignedTo)}</span>
            <span>📅 Due ${formatAssignmentDate(a.dueDate)}</span>
          </div>
          <div class="assignment-meta" style="margin-top:6px">
            <span>✅ Completed ${a.completedAt ? new Date(a.completedAt).toLocaleString() : '—'}</span>
          </div>
          <div class="assignment-meta" style="margin-top:6px">
            <span class="assignment-timing-badge ${late ? 'timing-late' : 'timing-on-time'}">${escapeHtml(a.timingText || (late ? 'Late' : 'On time'))}</span>
          </div>
          <div class="assignment-desc">${escapeHtml(a.description || '')}</div>
        </div>
      `;
    }).join('') : '<div class="empty">No completed assignments yet.</div>'}
  `;
}

async function createAssignmentFromUI(btn) {
  const title = document.getElementById('taskTitle').value.trim();
  const description = document.getElementById('taskDescription').value.trim();
  const assignedTo = document.getElementById('taskAssignee').value;
  const dueDate = document.getElementById('taskDueDate').value;
  if (!title || !description || !assignedTo || !dueDate) return toast('Complete all assignment fields.', 'error');
  setBtnLoading(btn, true);
  await withLoader('Assigning task…', async () => {
    const res = await apiPost({
      action: 'createAssignment',
      idempotencyKey: uid('TASK', assignedTo + ':' + title + ':' + dueDate),
      title, description, assignedTo, dueDate,
      user: state.user.username
    });
    if (!res.success) return toast(res.error || 'Could not assign task', 'error');
    toast('Assignment created', 'success');
    loadPage(true);
  });
  setBtnLoading(btn, false);
}

// ==================== MODALS / PWA / INIT ====================

function openModal(title, bodyHtml) {
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h2>${title}</h2>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">${bodyHtml}</div>
    </div>
  `;
  document.body.appendChild(overlay);
}
function closeModal() { document.querySelectorAll('.modal-overlay').forEach(m => m.remove()); }

let deferredPrompt = null;
// True when running inside the Android APK (Capacitor) - no "install" prompts needed there.
function isNativeApp(){
  try {
    if (window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function' && window.Capacitor.isNativePlatform()) return true;
  } catch (e) {}
  return false;
}
function isStandaloneApp(){
  return isNativeApp() ||
         window.matchMedia('(display-mode: standalone)').matches ||
         window.matchMedia('(display-mode: fullscreen)').matches ||
         window.navigator.standalone === true;
}
function setInstallButtonVisible(show){
  const b = document.getElementById('headerInstallBtn');
  if (!b) return;
  b.classList.toggle('hidden', !show || isStandaloneApp());
}
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  setInstallButtonVisible(true);
  if (!isStandaloneApp()) setTimeout(showInstallModal, 900);
});
window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  setInstallButtonVisible(false);
  closeModal();
  toast('Enican Mines System installed.', 'success');
});
function showInstallModal(){
  if (isStandaloneApp() || document.querySelector('.modal-overlay[data-install-prompt="1"]')) return;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const android = /android/i.test(navigator.userAgent);
  const icon = 'logo-192.png';
  const nativeInstall = deferredPrompt
    ? `<button class="btn" onclick="installPWA()">Install Enican Mines</button>`
    : '';
  const instructions = ios
    ? `<div class="pwa-platform-note"><b>iPhone / iPad</b><br>Open this site in Safari, tap <b>Share</b>, then choose <b>Add to Home Screen</b>.</div>`
    : (android && !deferredPrompt
      ? `<div class="pwa-platform-note"><b>Android</b><br>Tap the browser menu <b>⋮</b>, then choose <b>Install app</b> or <b>Add to Home screen</b>.</div>`
      : (!deferredPrompt ? `<div class="pwa-platform-note">Use your browser's <b>Install app</b> / <b>Add to Home screen</b> option when available.</div>` : ''));
  openModal('Install Enican Mines System', `
    <div class="pwa-install-card">
      <img class="pwa-modal-icon" src="${icon}" alt="Enican Mines System">
      <h3 style="margin:12px 0 4px;font-size:19px">Enican Mines System</h3>
      <div style="opacity:.9;font-size:13px;line-height:1.5">Install the system for a native app-like experience, faster access and a full-screen workspace.</div>
      ${nativeInstall}
    </div>
    ${instructions}
    <button class="btn btn-outline" style="margin-top:10px" onclick="closeModal()">Maybe later</button>
  `);
  const m = document.querySelector('.modal-overlay');
  if (m) m.dataset.installPrompt = '1';
}
async function installPWA(){
  if (!deferredPrompt) { showInstallModal(); return; }
  try {
    deferredPrompt.prompt();
    const choice = await deferredPrompt.userChoice;
    if (choice && choice.outcome === 'accepted') closeModal();
  } catch (e) { showInstallModal(); }
  deferredPrompt = null;
  setInstallButtonVisible(false);
}

// ==================== INIT ====================
// No blocking network call before the app appears: the system name is cached locally
// and refreshed in the background, and a saved session opens the app immediately.
(function init() {
  try { const n = localStorage.getItem(SYSNAME_KEY); if (n) state.systemName = n; } catch (e) {}
  applySystemName();
  const session = loadSession();
  if (session && session.user) {
    state.user = session.user;
    state.token = session.token || null;
    showApp();
  }
  loadSystemConfig();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
  }
  setInstallButtonVisible(!!deferredPrompt);
})();
</script>
